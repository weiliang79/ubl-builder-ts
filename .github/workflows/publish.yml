# Release on a version tag.
#
#   npm version minor      # bumps package.json, commits, tags v0.2.0
#                          # `postversion` then pushes the commit and the tag
#
# Pushing the tag runs the full CI gate on Node 20/22/24, then publishes to npm
# once — but only if every check passed and the tag agrees with package.json.
#
# Nothing here publishes from a branch push. A tag is the only trigger, so a
# release is always a deliberate act.
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN.
# npm is deprecating 2FA-bypass granular access tokens: they lost their
# account-management bypass in August 2026 and lose direct publishing around
# January 2027, after which a token publish only stages a release pending human
# 2FA approval. OIDC has no such deadline and no long-lived secret to leak.
#
# This requires one-time setup at npmjs.com on the package:
#   Settings -> Trusted Publisher -> GitHub Actions
#     organization/user   weiliang79
#     repository          ubl-builder-ts
#     workflow filename   publish.yml
# The repository and filename must match exactly or the exchange is refused.

name: Publish

on:
  push:
    tags:
      - 'v*'

# Two tags pushed close together would otherwise race for the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate main runs — called, not copied, so it cannot drift.
  ci:
    uses: ./.github/workflows/node.js.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      # write, not read, because the last step cuts a GitHub Release. Scoped to
      # this job — the ci job it depends on still runs with the default.
      contents: write
      # The whole authentication story. npm exchanges this OIDC token for a
      # short-lived publish credential, and uses it to sign the provenance
      # attestation linking the tarball to this workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 already ships npm 11,
      # but pinning it here means a change to the Node version cannot silently
      # drop below the floor and turn OIDC back into an auth failure.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # `npm publish` triggers prepublishOnly, which runs validate:xsd, which
      # shells out to xmllint. Same reason the CI workflow installs it.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Tag must match package.json
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${tag_version}, but package.json says ${pkg_version}."
            echo "::error::Use \`npm version\` to move both together."
            exit 1
          fi
          echo "Publishing version ${pkg_version}"

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already on npm. Versions are immutable; bump and tag again."
            exit 1
          fi

      # A prerelease must not become `latest`, or `npm install <pkg>` starts
      # handing everyone a beta.
      - name: Choose the dist-tag
        id: disttag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "tag=next"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Runs prepublishOnly first: build, lint, typecheck, check:schema,
      # check:types, test, validate:xsd. Redundant with the `ci` job above and
      # deliberately so — it is the gate that also protects a publish run by
      # hand from a laptop.
      - name: Publish
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}

      # Deliberately after the publish, never before: a release page announcing
      # a version that is not on npm is worse than no release page at all.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail

          # Notes written by hand when the release warrants them, generated from
          # the commit log when it does not. A file under .github/release-notes
          # named for the tag wins, so the notes are reviewable in the pull
          # request that raises them rather than appearing only after publish.
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
            echo "Using $notes_file"
          else
            notes=(--generate-notes)
            echo "No $notes_file; generating notes from the commit log"
          fi

          # --verify-tag refuses to invent a tag if the ref somehow went missing.
          # A prerelease is marked as one so it does not show as the latest
          # release, mirroring what --tag next does on the registry side.
          if [ "$DIST_TAG" = "next" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" "${notes[@]}" --verify-tag --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" "${notes[@]}" --verify-tag
          fi

      - name: Summary
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          {
            echo "### Published \`${name}@${version}\`"
            echo
            echo "- dist-tag: \`${DIST_TAG}\`"
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- <https://www.npmjs.com/package/${name}/v/${version}>"
            echo "- <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}>"
          } >> "$GITHUB_STEP_SUMMARY"
