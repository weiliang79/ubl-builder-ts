# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets publish.yml run this exact gate before it releases, so there is one
  # definition of "green" rather than a copy that drifts.
  #
  # `{}` rather than nothing: GitHub accepts a bare `workflow_call:` and reads
  # the null as "no inputs, secrets or outputs", but the JSON schema editors
  # validate against types it as an object, so the bare form is flagged in the
  # editor while working perfectly in CI. An empty object says the same thing
  # to both.
  workflow_call: {}

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      # Report every version's result. Without this a single failure cancels
      # the rest, and a version that was actually fine gets reported as failed.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    # libxml2-utils supplies xmllint, which validate:xsd shells out to.
    # It used to be preinstalled on the ubuntu runner image; it no longer is.
    - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    - run: npm run validate:xsd
    # Also needs xmllint: it stands in for LHDN's processor, checking that
    # c14n11 of the bytes we submit equals the bytes we digest.
    - run: npm run check:c14n
    - run: npm run check:schema
    - run: npm run check:types
    - run: npm run check:classref
    - run: npm run build --if-present
    - run: npm test
